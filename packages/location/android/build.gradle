group = "com.lyokone.location"
version = "1.0-SNAPSHOT"

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.3.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20")
        classpath("org.jlleitschuh.gradle:ktlint-gradle:14.2.0")
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: "com.android.library"
// The Kotlin Gradle plugin is deliberately not applied here (Built-in Kotlin,
// see https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors).
// With AGP 9's Built-in Kotlin enabled, AGP compiles the Kotlin sources itself;
// otherwise (AGP 8, or `android.builtInKotlin=false`) Flutter 3.44+ applies
// `kotlin-android` to plugins that don't. Flutter warns about, and will stop
// building, plugins whose build file applies it themselves (#1105).
apply plugin: "org.jlleitschuh.gradle.ktlint"

// Apps can leave Google Play services out of their build, e.g. to be
// distributed on F-Droid, by adding `location.playServices=false` to their
// android/gradle.properties. Location then always comes from the Android
// framework's LocationManager, as it already does on devices without Play
// services.
def usePlayServices = (findProperty("location.playServices") ?: "true").toString().toBoolean()
def playServicesSrcDir = usePlayServices ? "src/gms/kotlin" : "src/nogms/kotlin"

android {
    namespace = "com.lyokone.location"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        // Built-in Kotlin only compiles `kotlin` source dirs, while the Kotlin
        // Gradle plugin also compiles `java` ones, so register it with both.
        main.java.srcDirs += playServicesSrcDir
        main.kotlin.srcDirs += playServicesSrcDir
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
        targetSdk = 36
    }
}

// Use the top-level `kotlin` DSL instead of `android.kotlinOptions` so that the
// compiler options resolve both with KGP (AGP < 9) and with AGP 9's built-in
// Kotlin, where the `kotlinOptions` block is no longer available.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // allWarningsAsErrors = true // TODO(bartekpacia): Re-enable
    }
}

// ktlint-gradle 13.1+ is needed for Gradle 9, but it also bumps the bundled
// ktlint engine. Pin the engine to the version ktlint-gradle 12 used so the
// upgrade doesn't change which style rules apply.
ktlint {
    version.set("1.0.1")
}

dependencies {
    compileOnly("androidx.annotation:annotation:1.8.1")
    implementation("androidx.core:core-ktx:1.16.0")
    if (usePlayServices) {
        api("com.google.android.gms:play-services-location:21.3.0")
    }
}
